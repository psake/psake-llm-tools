name: Release Skill Packages

on:
  workflow_dispatch:
    inputs:
      skill:
        description: Skill package to release
        required: true
        type: choice
        options:
          - psake
          - powershellbuild
          - all
      version:
        description: Release version without the v prefix (e.g., 1.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"
      - "psake-v*"
      - "powershellbuild-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKILL="${{ github.event.inputs.skill }}"
            VERSION="${{ github.event.inputs.version }}"
            TAG="${SKILL}-v${VERSION}"
            if [ "$SKILL" = "all" ]; then
              TAG="v${VERSION}"
            fi
          else
            TAG="${{ github.ref_name }}"
            case "$TAG" in
              psake-v*)
                SKILL="psake"
                VERSION="${TAG#psake-v}"
                ;;
              powershellbuild-v*)
                SKILL="powershellbuild"
                VERSION="${TAG#powershellbuild-v}"
                ;;
              v*)
                SKILL="all"
                VERSION="${TAG#v}"
                ;;
              *)
                echo "Unsupported release tag: $TAG" >&2
                exit 1
                ;;
            esac
          fi
          echo "skill=$SKILL" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "## Releasing $SKILL $TAG" >> $GITHUB_STEP_SUMMARY

      - name: Create skill archives
        run: |
          if [ "${{ steps.release.outputs.skill }}" = "all" ]; then
            SKILLS="psake powershellbuild"
          else
            SKILLS="${{ steps.release.outputs.skill }}"
          fi
          for skill in $SKILLS; do
            (
              cd "plugins/$skill/skills/$skill"
              zip -r "$GITHUB_WORKSPACE/$skill.skill" .
            )
          done

      - name: Upload skill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.skill }}-skill-packages
          path: "*.skill"
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.skill }} ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          files: "*.skill"
          body: |
            ## psake Skill Packages

            This release contains the selected Claude skill package or packages.

            **Marketplace:** Add the marketplace in Claude Code:
            ```
            /plugin marketplace add https://github.com/psake/psake-llm-tools
            ```

            **Direct download:** Download a `.skill` file and upload it to Claude.
          generate_release_notes: true
