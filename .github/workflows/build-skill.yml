name: Build Skill Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v1.0.0)"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            # Push to main: check if version changed
            CURRENT=$(jq -r '.metadata.version // empty' .claude-plugin/marketplace.json)
            PREVIOUS=$(git show HEAD~1:.claude-plugin/marketplace.json 2>/dev/null | jq -r '.metadata.version // empty' || echo "")
            echo "Current version: $CURRENT"
            echo "Previous version: $PREVIOUS"
            if [ -n "$CURRENT" ] && [ "$CURRENT" != "$PREVIOUS" ]; then
              VERSION="v$CURRENT"
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "Version changed from $PREVIOUS to $CURRENT — will release $VERSION"
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "Version unchanged ($CURRENT) — skipping release"
            fi
          fi
          echo "version=${VERSION:-}" >> $GITHUB_OUTPUT
          echo "VERSION: ${VERSION:-none}" >> $GITHUB_STEP_SUMMARY

      - name: Create psake.skill archive
        if: steps.version.outputs.should_release == 'true'
        run: |
          cd plugins/psake/skills/psake
          zip -r psake.skill .
          mv psake.skill "$OLDPWD"
          cd "$OLDPWD"
          ls -lh psake.skill

      - name: Create powershellbuild.skill archive
        if: steps.version.outputs.should_release == 'true'
        run: |
          cd plugins/powershellbuild/skills/powershellbuild
          zip -r powershellbuild.skill .
          mv powershellbuild.skill "$OLDPWD"
          cd "$OLDPWD"
          ls -lh powershellbuild.skill

      - name: Upload skill artifacts
        if: steps.version.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skill-packages
          path: "*.skill"
          retention-days: 90

      - name: Display package info
        if: steps.version.outputs.should_release == 'true'
        run: |
          echo "## Skill Packages Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for skill in *.skill; do
            echo "### $skill" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -h $skill | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            unzip -l $skill >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Create git tag
        if: steps.version.outputs.should_release == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: psake-tools ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: "*.skill"
          body: |
            ## psake-tools Skill Packages

            This release contains Claude skill packages for the psake ecosystem.

            ### Skills Included

            | Skill | Description |
            |-------|-------------|
            | `psake.skill` | psake build automation for .NET, Node.js, Docker, and more |
            | `powershellbuild.skill` | PowerShellBuild standardized tasks for PowerShell module development |

            ### Installation

            **Marketplace (recommended):** Add the marketplace in Claude Code:
            ```
            /plugin marketplace add https://github.com/psake/psake-llm-tools
            ```
            Then install individual plugins with `/plugin install`.

            **Direct download:** Download a `.skill` file and upload it to Claude.
          generate_release_notes: true
