name: Release Skill Packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  detect-releases:
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.versions.outputs.has_releases }}
      matrix: ${{ steps.versions.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed skill versions
        id: versions
        run: |
          releases=()
          for skill in psake powershellbuild; do
            current=$(jq -r --arg skill "$skill" '.plugins[] | select(.name == $skill) | .version' .claude-plugin/marketplace.json)
            previous=$(git show HEAD^:.claude-plugin/marketplace.json 2>/dev/null | jq -r --arg skill "$skill" '.plugins[] | select(.name == $skill) | .version' || true)
            if [ -n "$current" ] && [ "$current" != "$previous" ]; then
              releases+=("{\"skill\":\"$skill\",\"version\":\"$current\"}")
            fi
          done
          if [ ${#releases[@]} -eq 0 ]; then
            echo 'has_releases=false' >> $GITHUB_OUTPUT
            echo 'matrix={"include":[]}' >> $GITHUB_OUTPUT
          else
            matrix=$(IFS=,; echo "${releases[*]}")
            echo 'has_releases=true' >> $GITHUB_OUTPUT
            echo "matrix={\"include\":[${matrix}]}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: detect-releases
    if: needs.detect-releases.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.detect-releases.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create skill archive
        run: |
          cd "plugins/${{ matrix.skill }}/skills/${{ matrix.skill }}"
          zip -r "$GITHUB_WORKSPACE/${{ matrix.skill }}.skill" .

      - name: Upload skill artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill }}-v${{ matrix.version }}
          path: ${{ matrix.skill }}.skill
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ matrix.skill }}-v${{ matrix.version }}
          name: ${{ matrix.skill }} v${{ matrix.version }}
          draft: false
          prerelease: false
          files: ${{ matrix.skill }}.skill
          body: |
            ## ${{ matrix.skill }} Skill Package

            This release contains the `${{ matrix.skill }}.skill` package.

            **Marketplace:** Add the marketplace in Claude Code:
            ```
            /plugin marketplace add https://github.com/psake/psake-llm-tools
            ```

            **Direct download:** Download the `.skill` file and upload it to Claude.
          generate_release_notes: true
